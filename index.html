<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>#1Setters</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#070610; --bg-2:#0c0a18; --card:#14111f; --card-2:#1b1729; --card-3:#241f37;
    --border:#2a2442; --border-2:#3a3360;
    --text:#f3f1fa; --muted:#a09aba; --muted-2:#6f6a8a;
    --violet:#9b6dff; --violet-2:#c4a5ff; --violet-deep:#7c3aed;
    --magenta:#d946ef; --magenta-2:#ec80ff;
    --green:#34d399; --green-2:#22c55e; --amber:#f59e0b; --red:#f87171; --cyan:#22d3ee;
    --radius:16px; --radius-sm:10px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2a2a33;border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}
  a{color:var(--violet-2);text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}
  .hidden{display:none !important}

  /* ===== AUTH ===== */
  #auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
    background:
      radial-gradient(820px 500px at 50% 20%, rgba(168,85,247,.22), transparent 60%),
      radial-gradient(640px 440px at 82% 84%, rgba(217,70,239,.14), transparent 60%),
      radial-gradient(560px 440px at 14% 74%, rgba(124,58,237,.16), transparent 62%),
      var(--bg)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .logo{width:40px;height:40px;border-radius:12px;overflow:hidden;background:#0a0714;display:block;
    box-shadow:0 0 0 1px rgba(196,165,255,.25), 0 6px 20px rgba(155,109,255,.5), 0 0 26px rgba(217,70,239,.4)}
  .logo svg{width:100%;height:100%;display:block}
  .brand .name{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .auth-head{text-align:center;margin:18px 0 6px}
  .auth-head h1{font-size:30px;font-weight:800;letter-spacing:-1px}
  .auth-head p{color:var(--muted);font-size:15px;margin-top:4px}
  .auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px;margin-top:18px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
  .field .row{display:flex;justify-content:space-between;align-items:center}
  .input{width:100%;background:#eef0f6;color:#16161b;border:1px solid transparent;border-radius:10px;padding:13px 14px;font-size:15px;outline:none}
  .input::placeholder{color:#9aa0ad}
  .input:focus{border-color:var(--violet)}
  .input.dark{background:#101015;color:var(--text);border:1px solid var(--border-2)}
  .btn-primary{width:100%;background:linear-gradient(135deg,#9b6dff,#7c3aed);color:#fff;border:none;border-radius:10px;padding:13px;font-weight:700;font-size:15px;
    box-shadow:0 8px 22px rgba(124,58,237,.45),0 0 20px rgba(217,70,239,.22);transition:.15s}
  .btn-primary:hover{background:linear-gradient(135deg,#aa80ff,#8b5cf6)}
  .auth-foot{margin-top:20px;color:var(--muted);font-size:14px}
  .auth-err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);color:#fca5a5;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px}

  /* ===== APP SHELL ===== */
  #app{display:flex;min-height:100vh}
  .sidebar{width:248px;flex:0 0 248px;background:var(--bg-2);border-right:1px solid var(--border);padding:20px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sb-brand{display:flex;align-items:center;gap:11px;padding:4px 6px 18px}
  .sb-brand .logo{width:34px;height:34px;border-radius:9px;font-size:17px}
  .sb-brand .name{font-size:17px;font-weight:800}
  .profile{display:flex;align-items:center;gap:11px;padding:11px 8px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:.12s}
  .profile:hover{background:#16131f;border-color:var(--border)}
  .avatar{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
  .profile .pn{font-weight:700;font-size:14px;line-height:1.2}
  .profile .pr{color:var(--muted);font-size:12px}
  .streak{display:inline-flex;align-items:center;gap:6px;margin:10px 8px 6px;padding:5px 11px;border-radius:9px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);color:#fbbf24;font-size:12px;font-weight:700}
  .nav-group{margin-top:18px}
  .nav-label{font-size:10px;letter-spacing:1.4px;color:var(--muted-2);font-weight:700;text-transform:uppercase;padding:0 10px;margin-bottom:8px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 11px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;transition:.12s;margin-bottom:2px}
  .nav-item svg{width:18px;height:18px;opacity:.9}
  .nav-item:hover{background:#16161c;color:var(--text)}
  .nav-item.active{background:linear-gradient(90deg,rgba(155,109,255,.20),rgba(217,70,239,.10));color:#fff;box-shadow:inset 2px 0 0 var(--violet)}
  .nav-item.active svg{color:var(--violet-2);opacity:1}
  .sb-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}

  .main{flex:1;min-width:0;padding:34px 40px 80px}
  .view{max-width:1180px;margin:0 auto}

  /* ===== HEADERS ===== */
  .page-eyebrow{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
  .page-title{font-size:34px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;gap:12px}
  .page-sub{color:var(--muted);margin-top:4px;font-size:15px}
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px;flex-wrap:wrap}
  .title-icon{width:46px;height:46px;border-radius:12px;background:var(--card-2);border:1px solid var(--border);display:grid;place-items:center;color:var(--violet-2)}

  /* ===== CARDS / GRID ===== */
  .grid{display:grid;gap:16px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;position:relative;overflow:hidden}
  .card.accent::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--violet),var(--magenta))}
  .card.a-green::before{background:linear-gradient(90deg,#34d399,#10b981)}
  .card.a-violet::before{background:linear-gradient(90deg,#c4a5ff,#d946ef)}
  .card.a-amber::before{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
  .card.a-cyan::before{background:linear-gradient(90deg,#22d3ee,#06b6d4)}
  .card.a-red::before{background:linear-gradient(90deg,#fb7185,#ef4444)}
  .metric .ic{width:38px;height:38px;border-radius:10px;background:var(--card-3);display:grid;place-items:center;margin-bottom:14px;color:var(--violet-2)}
  .metric .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .metric .val{font-size:32px;font-weight:800;letter-spacing:-1px;margin-top:6px}
  .metric .meta{color:var(--muted);font-size:13px;margin-top:4px}
  .card-h{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
  .card-h.flex{display:flex;justify-content:space-between;align-items:center}
  .card-sub{color:var(--muted-2);font-size:12px;margin-bottom:14px}
  .section-label{color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin:30px 0 14px}

  .chart-wrap{height:230px;position:relative}

  /* rows */
  .srow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}
  .srow:last-child{border-bottom:none}
  .srow .k{color:var(--muted-2)}
  .srow .v{font-weight:700}
  .delta{color:var(--green);font-size:13px;font-weight:700;margin-right:10px}
  .delta.neg{color:var(--red)}

  /* progress */
  .prog{height:7px;border-radius:6px;background:#23232b;overflow:hidden;margin-top:7px}
  .prog>i{display:block;height:100%;border-radius:6px;background:var(--violet)}
  .prog.green>i{background:var(--green)}
  .prog.red>i{background:var(--red)}
  .goalrow{margin-bottom:15px}
  .goalrow .top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:0}
  .goalrow .top b{color:var(--text)}

  /* table */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted-2);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border)}
  td{padding:13px 12px;border-bottom:1px solid var(--border);font-size:14px}
  tr:last-child td{border-bottom:none}
  th.num,td.num{text-align:right}
  .pos{color:var(--green);font-weight:700}
  .vio{color:var(--violet-2);font-weight:700}
  .amb{color:var(--amber);font-weight:700}

  .banner{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-top:26px}
  .banner .dot{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block;margin-right:10px;box-shadow:0 0 10px var(--red)}

  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:10px;font-weight:700;font-size:14px;border:1px solid var(--border-2);background:var(--card-2);color:var(--text);transition:.12s}
  .btn:hover{background:var(--card-3)}
  .btn.vio{background:linear-gradient(135deg,#8b5cf6,#7c3aed);border-color:transparent;box-shadow:0 8px 20px rgba(124,58,237,.4),0 0 16px rgba(217,70,239,.18)}
  .btn.vio:hover{background:linear-gradient(135deg,#9b6dff,#8b5cf6)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:7px 12px;font-size:13px}
  .btn-row{display:flex;gap:10px;align-items:center}

  /* forms */
  .form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:18px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .form-grid.g3{grid-template-columns:repeat(3,1fr)}
  .fl{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .fl .opt{color:var(--muted-2);text-transform:none;letter-spacing:0;font-weight:500}
  .finput{width:100%;background:#0e0e13;border:1px solid var(--border-2);border-radius:10px;padding:12px 13px;color:var(--text);outline:none}
  .finput:focus{border-color:var(--violet)}
  textarea.finput{resize:vertical;min-height:64px}
  .group-card{background:#101015;border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
  .group-card h4{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:700}

  .tabs{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:5px;gap:4px;margin-bottom:22px}
  .tab{padding:9px 18px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);border:none;background:transparent}
  .tab.active{background:var(--violet-deep);color:#fff}

  .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{padding:8px 15px;border-radius:9px;border:1px solid var(--border-2);background:transparent;color:var(--muted);font-weight:700;font-size:13px}
  .chip.active{background:var(--amber);color:#1a1205;border-color:transparent}
  .chip.vio.active{background:var(--violet-deep);color:#fff}

  .pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .pill.you{background:rgba(124,58,237,.2);color:var(--violet-2)}
  .pill.role{background:var(--card-3);color:var(--muted)}
  .pill.verified{background:rgba(52,211,153,.16);color:var(--green)}

  .toggle{width:46px;height:26px;border-radius:14px;background:#33333f;position:relative;border:none;transition:.15s;flex:0 0 auto}
  .toggle.on{background:var(--amber)}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
  .toggle.on::after{left:23px}

  .empty{color:var(--muted-2);text-align:center;padding:40px;font-size:14px}

  /* reflection */
  .rpanel{display:none}
  .rpanel.active{display:block}
  .insight{border-left:3px solid var(--violet);background:#101015;border-radius:0 10px 10px 0;padding:13px 16px;margin-bottom:10px}
  .insight .il{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--violet-2);margin-bottom:5px}
  .insight .it{font-size:14px;color:var(--text);line-height:1.65;white-space:pre-wrap}
  .rbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 11px;border-radius:20px;margin:0 6px 6px 0;font-weight:600}
  .rbadge.win{background:rgba(52,211,153,.14);color:#34d399;border:1px solid rgba(52,211,153,.35)}
  .rbadge.hard{background:rgba(248,113,113,.13);color:#fca5a5;border:1px solid rgba(248,113,113,.35)}
  .rbadge.energy{background:rgba(245,158,11,.14);color:#fbbf24;border:1px solid rgba(245,158,11,.35)}
  select.finput{appearance:auto}

  /* MoneyGT */
  .gold{color:var(--amber)}
  .mg-month-nav{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:5px}
  .mg-month-nav button{background:transparent;color:var(--text);border:none;padding:6px 11px;border-radius:7px;cursor:pointer;font-size:14px}
  .mg-month-nav button:hover{background:var(--card-3)}
  .mg-month-nav .ml{padding:0 8px;font-weight:700;min-width:130px;text-align:center}
  .mg-banner{background:linear-gradient(135deg,#15151b 0%, #221833 100%);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:18px;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:20px;align-items:center}
  .mg-banner .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .mg-banner .big{font-size:36px;font-weight:800;color:var(--green);letter-spacing:-1px;line-height:1}
  .mg-banner .sub{font-size:13px;color:var(--muted-2);margin-top:6px}
  .mg-banner .v{font-size:18px;font-weight:800}
  .mg-nav{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;padding:2px}
  .mg-nav button{background:transparent;color:var(--text);border:none;padding:2px 8px;border-radius:5px;cursor:pointer;font-size:13px}
  .mg-nav button:hover{background:var(--card-3)}
  .mg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:18px}
  .mg-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px}
  .mg-stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .mg-stat .v{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .mg-stat .s{font-size:12px;color:var(--muted-2);margin-top:4px}
  .mg-entry{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 6px;border-bottom:1px solid var(--border);border-radius:8px}
  .mg-entry:hover{background:var(--card-2)}
  @media(max-width:800px){.mg-banner{grid-template-columns:1fr 1fr}}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:24px}
  .modal{max-width:520px;width:100%}
  .modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .x{width:34px;height:34px;border-radius:9px;background:var(--card-2);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted)}

  /* preview card */
  .pcard{background:radial-gradient(120% 80% at 50% 0%, #1a1230 0%, #0e0b16 55%, #0b0913 100%);border:1px solid #2e2750;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(155,109,255,.18)}
  .pcard .pc-head{padding:26px 28px 4px}
  .pc-brand{display:flex;align-items:center;gap:9px;color:var(--violet-2);font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase}
  .pc-brand .logo{width:26px;height:26px;border-radius:7px;font-size:13px}
  .pc-name{font-size:42px;font-weight:800;letter-spacing:-1.5px;margin-top:14px;display:flex;align-items:center;gap:12px}
  .pc-role{color:var(--muted);font-size:15px;margin-top:2px}
  .pc-hero{padding:22px 28px 26px;border-bottom:1px solid #1c1c26}
  .pc-hero .lbl{color:var(--green);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800}
  .pc-hero .big{font-size:60px;font-weight:800;letter-spacing:-2px;color:var(--green);text-shadow:0 0 40px rgba(52,211,153,.45);line-height:1.05;margin-top:6px}
  .pc-hero .sub{color:var(--muted);font-size:13px;margin-top:8px}
  .pc-3{display:grid;grid-template-columns:repeat(3,1fr)}
  .pc-3>div{padding:18px 28px;border-right:1px solid #1c1c26;border-bottom:1px solid #1c1c26}
  .pc-3>div:last-child{border-right:none}
  .pc-3 .l{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted-2);font-weight:700}
  .pc-3 .n{font-size:22px;font-weight:800;margin-top:5px}
  .pc-4{display:grid;grid-template-columns:repeat(4,1fr)}
  .pc-4>div{padding:16px 28px;border-right:1px solid #1c1c26}
  .pc-4>div:last-child{border-right:none}
  .pc-4 .l{font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted-2);font-weight:700}
  .pc-4 .n{font-size:19px;font-weight:800;margin-top:4px}
  .pc-best{display:flex;justify-content:space-between;padding:18px 28px;background:#121208}
  .pc-best .l{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--amber);font-weight:700}
  .pc-best .n{font-size:24px;font-weight:800;color:var(--amber);margin-top:4px}
  .pc-best .r{text-align:right}
  .pc-best .r .l{color:var(--muted-2)}
  .pc-best .r .n{color:var(--text)}
  .pc-foot{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;color:var(--muted-2);font-size:12px}
  .pc-foot a{color:var(--violet-2);font-weight:800;letter-spacing:.5px;font-size:12px}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--card-3);border:1px solid var(--border-2);color:var(--text);padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transition:.2s}
  .toast.show{opacity:1;bottom:34px}

  /* public card route */
  #public{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;
    background:radial-gradient(800px 500px at 50% 20%, rgba(124,58,237,.1), transparent 70%), var(--bg)}
  .public-top{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;color:var(--muted)}

  @media(max-width:1080px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
  @media(max-width:760px){

function cloudPushDebounced(){ if(!CLOUD_ON) return; clearTimeout(_pushT); _pushT=setTimeout(cloudPush,600); }
async function cloudPush(){

}
/* load my data + all visible players into the in-memory Store */
async function cloudLoad(authUser){
  const uid=authUser.id;
  Store.data={users:[],logs:{},records:{},goals:{},reflections:{},moneyGoals:{},moneyEntries:{},session:uid,_seq:Date.now()};
  let mine=null, priv={};
  try{
    const [mineRes,privRes,othersRes]=await Promise.all([
      sb.from('players').select('*').eq('id',uid).maybeSingle(),
      sb.from('player_private').select('data').eq('id',uid).maybeSingle(),
      sb.from('players').select('id,email,name,visible,public,logs')
    ]);
    mine=mineRes.data; priv=(privRes.data&&privRes.data.data)||{};
    (othersRes.data||[]).forEach(r=>{ if(r.id===uid) return; const p=r.public||{};
      Store.data.users.push({id:r.id,email:r.email,name:r.name||p.name||'Setter',role:p.role||'Setter',color:p.color||'#7c3aed',photo:p.photo||'',city:p.city||'',bio:p.bio||'',socials:p.socials||{},verified:!!p.verified,visible:!!r.visible});
      Store.data.logs[r.id]=r.logs||[];
    });
  }catch(e){ console.error('[Transcend] cloud load failed',e); }
  const p=(mine&&mine.public)||{};
  Store.data.users.push({id:uid,email:authUser.email,name:(mine&&mine.name)||p.name||(authUser.user_metadata&&authUser.user_metadata.full_name)||authUser.email.split('@')[0],role:p.role||'Setter',color:p.color||'#7c3aed',photo:p.photo||'',city:p.city||'',bio:p.bio||'',socials:p.socials||{},verified:!!p.verified,visible:mine?!!mine.visible:true});
  Store.data.logs[uid]=(mine&&mine.logs)||[];

  Store.data.goals[uid]=priv.goals||{};
  Store.data.reflections[uid]=priv.reflections||[];
  Store.data.moneyGoals[uid]=priv.moneyGoals||{};
  Store.data.moneyEntries[uid]=priv.moneyEntries||[];
  if(!mine){ await cloudPush(); }  // first login → create my row
}

};

/* ---------------- Store (localStorage backend) ---------------- */
const Store = {
  data:null,
  load(){
    try{ this.data = JSON.parse(localStorage.getItem(DB_KEY)); }catch(e){ this.data=null; }
    if(!this.data || !this.data.users){ this.seed(); }

  },
  save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(this.data)); }catch(e){} if(CLOUD_ON) cloudPushDebounced(); },
  profileBackfill(){
    if(CLOUD_ON)return;
    if(this.data._profilesV1)return;
    const set=(id,p)=>{const u=this.user(id);if(!u)return;Object.keys(p).forEach(k=>{ if(k==='socials'){ if(!u.socials||!Object.keys(u.socials).length)u.socials=p.socials; } else if(u[k]===undefined||u[k]===''){u[k]=p[k];} });};

    set('u2',{city:'Austin, TX',bio:'Setter & team lead — verified numbers, no fluff.',socials:{instagram:'sofiacloses',x:'sofiacloses',linkedin:'sofia-reyes',tiktok:''}});
    set('u3',{city:'Los Angeles, CA',bio:'Turning conversations into closes.',socials:{instagram:'marcus.closes',x:'',linkedin:'',tiktok:'marcusleecloses'}});
    set('u4',{city:'Miami, FL',bio:'Grinding toward $1M cash collected.',socials:{instagram:'devincarter',x:'',linkedin:'',tiktok:''}});

    this.data._profilesV1=true; this.save();

    this.data = { users:[], logs:{}, records:{}, goals:{}, session:null, _seq:1 };
    const mk = (id,name,email,pw,opts={})=>{ this.data.users.push(Object.assign({id,name,email,pw:btoa(pw),role:'Setter',verified:false,visible:true,phone:'',city:'',bio:'',photo:'',socials:{},color:opts.color||'#7c3aed'},opts)); this.data.logs[id]=[]; this.data.records[id]=[]; this.data.goals[id]={}; };

    const arr=this.data.logs[uid]||(this.data.logs[uid]=[]);
    if(entry.id && arr.some(l=>l.id===entry.id)){
      // editing existing entry; drop any *other* entry sharing the new date
      for(let i=arr.length-1;i>=0;i--){ if(arr[i].date===entry.date && arr[i].id!==entry.id) arr.splice(i,1); }
      arr[arr.findIndex(l=>l.id===entry.id)]=entry;
    } else {
      const i=arr.findIndex(l=>l.date===entry.date);
      if(i>=0){ entry.id=arr[i].id; arr[i]=entry; }   // overwrite same date
      else { entry.id='l'+(this.data._seq++); arr.push(entry); }
    }
    this.save(); return entry.id;

  deleteLog(uid,id){this.data.logs[uid]=(this.data.logs[uid]||[]).filter(l=>l.id!==id);this.save();},

  deleteReflection(uid,id){if(!this.data.reflections)return;this.data.reflections[uid]=(this.data.reflections[uid]||[]).filter(x=>x.id!==id);this.save();},
  /* MoneyGT — money goal tracker */
  moneyGoals(uid){if(!this.data.moneyGoals)this.data.moneyGoals={};return this.data.moneyGoals[uid]||{};},
  setMoneyGoal(uid,mKey,amt){if(!this.data.moneyGoals)this.data.moneyGoals={};if(!this.data.moneyGoals[uid])this.data.moneyGoals[uid]={};this.data.moneyGoals[uid][mKey]=amt;this.save();},
  moneyEntries(uid){if(!this.data.moneyEntries)this.data.moneyEntries={};return this.data.moneyEntries[uid]||[];},
  addMoneyEntry(uid,date,amount){if(!this.data.moneyEntries)this.data.moneyEntries={};const arr=this.data.moneyEntries[uid]||(this.data.moneyEntries[uid]=[]);const e={id:'me'+(this.data._seq++),date,amount};arr.push(e);this.save();return e;},
  updateMoneyEntry(uid,id,amount){const arr=this.data.moneyEntries[uid]||[];const e=arr.find(x=>x.id===id);if(e)e.amount=amount;this.save();},
  deleteMoneyEntry(uid,id){if(!this.data.moneyEntries)return;this.data.moneyEntries[uid]=(this.data.moneyEntries[uid]||[]).filter(x=>x.id!==id);this.save();},
  mgSeed(uid){
    if(CLOUD_ON)return;
    const u=this.user(uid); if(!u||u.mgSeeded)return;
    if(!this.data.moneyGoals)this.data.moneyGoals={};
    if(!this.data.moneyEntries)this.data.moneyEntries={};
    const hasE=(this.data.moneyEntries[uid]||[]).length, hasG=Object.keys(this.data.moneyGoals[uid]||{}).length;
    if(hasE||hasG){u.mgSeeded=true;this.save();return;}
    const yr=new Date().getFullYear(); const p=n=>String(n).padStart(2,'0');
    const E=[['01-06',1500],['01-15',2000],['01-24',3000],['02-03',3000],['02-12',2500],['02-20',2000],['02-27',1800],['03-05',4000],['03-14',3500],['03-25',3200],['04-08',2500],['04-19',2500],['04-29',2000],['05-07',2000],['05-14',1500],['05-21',1500]];
    this.data.moneyEntries[uid]=E.map(([md,amt])=>({id:'me'+(this.data._seq++),date:yr+'-'+md,amount:amt}));
    this.data.moneyGoals[uid]={};
    [['01',8000],['02',8000],['03',10000],['04',10000],['05',12000]].forEach(([m,g])=>{this.data.moneyGoals[uid][yr+'-'+m]=g;});
    u.mgSeeded=true; this.save();
  }
};

/* ---------------- date helpers ---------------- */
function ymd(d){return d.toISOString().slice(0,10);}
function today(){return new Date();}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseD(s){const [y,m,da]=s.split('-').map(Number);return new Date(y,m-1,da);}
function fmtMonth(s){const [y,m]=s.split('-');return new Date(y,m-1,1).toLocaleString('en-US',{month:'long',year:'numeric'});}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function fmtDate(s){return parseD(s).toLocaleString('en-US',{month:'short',day:'numeric'});}
function fmtDateFull(s){return parseD(s).toLocaleString('en-US',{month:'long',day:'numeric',year:'numeric'});}
function weekRange(d){ // ISO week, Monday start
  const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0);
  const end=new Date(x); end.setDate(end.getDate()+6); return [x,end];
}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function inRange(s,a,b){const d=parseD(s);return d>=a&&d<=b;}

/* ---------------- aggregation ---------------- */
// Aggregate setter logs. Setter fields: dials, pickups, convos, dq, sets,
// fumbles, shows, pitched, closed, cash, revenue. Derived rates: showRate
// (shows/sets), showPitch (pitched/shows), pitchClose (closed/pitched),
// fumbleRate. Commission is entered manually per log (l.commission), with
// an optional per-log rate (l.commissionRate, %) that auto-computes from
// cash when the user enters a rate instead of a dollar amount.
function agg(logs){
  const t={dials:0,pickups:0,convos:0,dq:0,sets:0,fumbles:0,shows:0,pitched:0,closed:0,cash:0,revenue:0,commission:0,days:logs.length,best:0};
  logs.forEach(l=>{
    t.dials+=l.dials||0; t.pickups+=l.pickups||0; t.convos+=l.convos||0; t.dq+=l.dq||0;
    t.sets+=l.sets||0; t.fumbles+=l.fumbles||0; t.shows+=l.shows||0; t.pitched+=l.pitched||0;
    t.closed+=l.closed||0; t.cash+=l.cash||0; t.revenue+=l.revenue||0;
    // Commission: prefer explicit dollar amount, otherwise compute from rate × cash.
    const dailyComm = (l.commission && +l.commission > 0)
      ? +l.commission
      : ((l.commissionRate||0) * (l.cash||0) / 100);
    t.commission += dailyComm;
    if((l.cash||0)>t.best) t.best=l.cash||0;
  });
  t.connectRate = t.dials   ? t.pickups/t.dials*100   : 0;
  t.showRate    = t.sets    ? t.shows/t.sets*100      : 0;
  t.showPitch   = t.shows   ? t.pitched/t.shows*100   : 0;
  t.pitchClose  = t.pitched ? t.closed/t.pitched*100  : 0;
  t.fumbleRate  = t.sets    ? t.fumbles/t.sets*100    : 0;
  // Aliases for any legacy closer-term callers that still reference them.
  t.calls=t.dials; t.closeRate=t.pitchClose; t.offers=t.pitched; t.comm=t.commission;
  t.cashPerClose=t.closed?t.cash/t.closed:0;
  return t;
}
function logsInRange(logs,a,b){return logs.filter(l=>inRange(l.date,a,b));}
function streak(logs){
  if(!logs.length)return 0;
  const set=new Set(logs.map(l=>l.date));
  let s=0;let d=new Date();d.setHours(0,0,0,0);
  // allow streak to count from today or yesterday
  if(!set.has(ymd2(d))){d=addDays(d,-1);if(!set.has(ymd2(d)))return 0;}
  while(set.has(ymd2(d))){s++;d=addDays(d,-1);}
  return s;
}
function ymd2(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ---------------- format ---------------- */
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const pct=n=>(Math.round(n*10)/10).toFixed(1)+'%';
const initials=name=>name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const escHtml=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const escAttr=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- toast ---------------- */
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}

function srow(label,val,prev,fmt){
  const d=val-prev; const up=d>=0;
  return `<div class="srow"><span class="k">${label}</span><span><span class="delta ${up?'':'neg'}">${up?'↗':'↘'}${fmt(Math.abs(d))}</span><span class="v">${fmt(val)}</span></span></div>`;
}
function srowPct(label,val,prev){
  const d=val-prev; const up=d>=0;
  return `<div class="srow"><span class="k">${label}</span><span><span class="delta ${up?'':'neg'}">${up?'↗':'↘'}${pct(Math.abs(d))}</span><span class="v">${pct(val)}</span></span></div>`;
}
function miniGoal(val,target,fmt){
  const p=target?Math.min(100,val/target*100):0;
  return `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted)"><span>${fmt(val)}</span><span>/ ${fmt(target)}</span></div><div class="prog"><i style="width:${p}%"></i></div></div>`;
}

let _charts={};
function drawCashChart(monthLogs,now){
  const ctx=document.getElementById('cashChart');if(!ctx||!window.Chart)return;
  if(_charts.cash)_charts.cash.destroy();
  const days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const labels=[],vals=[];
  for(let d=1;d<=days;d++){labels.push(d);const key=monthKey(now)+'-'+String(d).padStart(2,'0');const l=monthLogs.find(x=>x.date===key);vals.push(l?l.cash:0);}
  _charts.cash=new Chart(ctx,{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:'#34d399',borderRadius:4,maxBarThickness:14}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>money(c.parsed.y)}}},
    scales:{x:{grid:{display:false},ticks:{color:'#6c6c77',font:{size:10},maxRotation:0,autoSkip:true,maxTicksLimit:16}},
      y:{grid:{color:'#1c1c24'},ticks:{color:'#6c6c77',font:{size:10},callback:v=>'$'+(v/1000)+'k'}}}}});
}
function drawTrendChart(logs,now){
  const ctx=document.getElementById('trendChart');if(!ctx||!window.Chart)return;
  if(_charts.trend)_charts.trend.destroy();
  const start=addDays(now,-30);
  const pts=logs.filter(l=>parseD(l.date)>=start&&parseD(l.date)<=now).map(l=>({x:fmtDate(l.date),y:(l.pitched||0)?Math.round((l.closed||0)/(l.pitched||1)*1000)/10:0}));
  const labels=pts.map(p=>p.x), vals=pts.map(p=>p.y);
  _charts.trend=new Chart(ctx,{type:'line',data:{labels,datasets:[{data:vals,borderColor:'#8b5cf6',backgroundColor:'rgba(139,92,246,.15)',fill:true,tension:.3,pointRadius:4,pointBackgroundColor:'#a78bfa'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>pct(c.parsed.y)}}},
    scales:{x:{grid:{display:false},ticks:{color:'#6c6c77',font:{size:10}}},y:{min:0,max:100,grid:{color:'#1c1c24'},ticks:{color:'#6c6c77',font:{size:10},callback:v=>v+'%'}}}}});
}

function liveStats(){
  const n=id=>+document.getElementById(id).value||0;
  const sets=n('lSets'),shows=n('lShows'),pitched=n('lPitched'),closed=n('lClosed'),cash=n('lCash');
  const directComm=n('lCommission'), rate=n('lCommissionRate');
  // Dollar amount wins if both are entered; otherwise compute rate × cash.
  const comm = directComm>0 ? directComm : (rate*cash/100);
  document.getElementById('sShow').textContent=sets?pct(shows/sets*100):'—';
  document.getElementById('sShowPitch').textContent=shows?pct(pitched/shows*100):'—';
  document.getElementById('sPitchClose').textContent=pitched?pct(closed/pitched*100):'—';
  document.getElementById('sComm').textContent='$'+comm.toLocaleString(undefined,{maximumFractionDigits:2});
}

/* ---- send a call to the custom ChatGPT coach (Scott) ---- */
function coachPrompt(rec){
  let p='Please review this sales call and coach me on it — what I did well, what to fix, and how to close better next time.\n\n';
  p+='Lead: '+(rec.lead||'—')+'\n';
  p+='Date: '+(rec.date||'—')+'\n';
  p+='Outcome: '+(rec.outcome||'—')+'\n';
  if(rec.value)p+='Deal value: $'+Number(rec.value).toLocaleString('en-US')+'\n';
  if(rec.notes)p+='My notes: '+rec.notes+'\n';
  p+='\nTranscript:\n'+(rec.transcript?rec.transcript:'(no transcript pasted — I will describe the call)');
  return p;
}
function openInScott(rec){
  const text=coachPrompt(rec);
  let copied=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text); copied=true; } }catch(e){}
  window.open(SCOTT_GPT_URL,'_blank','noopener');
  toast(copied?'Transcript + context copied — paste it into Scott (Ctrl/Cmd+V).':'Opening Scott — copy your transcript to paste in.');
}
function analyseWithScottForm(){
  const rec={lead:document.getElementById('rLead').value.trim(),date:document.getElementById('rDate').value,outcome:document.getElementById('rOutcome').value,value:+document.getElementById('rValue').value||0,notes:document.getElementById('rNotes').value.trim(),transcript:document.getElementById('rTranscript').value.trim()};
  openInScott(rec);
}
function openReviewInScott(id){const u=Store.current();const r=Store.records(u.id).find(x=>x.id===id);if(r)openInScott(r);}
function analyzeTranscriptHTML(t){
  const words=t.split(/\s+/).length;
  const q=(t.match(/\?/g)||[]).length;
  const objections=['too expensive','can\'t afford','think about it','talk to my','not sure','too much','budget','no money','later'];
  const found=objections.filter(o=>t.toLowerCase().includes(o));
  const positives=['yes','sounds good','let\'s do it','sign me up','i\'m in','perfect','great'];
  const pos=positives.filter(p=>t.toLowerCase().includes(p));
  const talkRatio=Math.min(95,Math.max(35,Math.round(q/Math.max(1,words/100)*40)+45));
  return `<div style="margin-top:16px;background:#101015;border:1px solid var(--border);border-radius:12px;padding:16px">
    <div style="font-weight:800;margin-bottom:10px">✨ Call Analysis</div>
    <div class="srow"><span class="k">Transcript length</span><span class="v">${words.toLocaleString()} words</span></div>
    <div class="srow"><span class="k">Discovery questions asked</span><span class="v ${q>=8?'pos':'amb'}">${q}</span></div>
    <div class="srow"><span class="k">Est. listening ratio</span><span class="v ${talkRatio<=55?'pos':'amb'}">${talkRatio}% lead / ${100-talkRatio}% you</span></div>
    <div class="srow"><span class="k">Objections detected</span><span class="v ${found.length?'amb':'pos'}">${found.length?found.join(', '):'none'}</span></div>
    <div class="srow"><span class="k">Buying signals</span><span class="v ${pos.length?'pos':'amb'}">${pos.length?pos.join(', '):'none'}</span></div>
    <div style="margin-top:12px;color:var(--muted);font-size:13px">${q<8?'Ask more discovery questions before pitching. ':'Strong discovery. '}${found.length?'Address the '+found[0]+' objection with value framing. ':''}${pos.length?'Buying signals present — make sure you asked for the close.':'No clear buying signals — tighten your close.'}</div>
  </div>`;
}

/* ---- on-device reflection engine (no API key, runs in the browser) ---- */
const WIN_K=['closed','won','crushed','hit','nailed','proud','finally','landed','booked','signed','great','amazing','breakthrough','progress','showed up','did it','best','beat'];
const HARD_K=['hard','tough','struggle','struggled','tired','exhausted','stuck','failed','lost','missed','anxious','anxiety','frustrated','frustrating','overwhelmed','doubt','scared','afraid','nervous','rejected','no-show','ghosted','burned out','burnt out'];
const DRAIN_K=['drained','exhausted','tired','low energy','dragged','procrastinated','distracted','scrolling','avoided','dip','sluggish','unfocused'];
const UP_K=['energized','motivated','excited','flow','locked in','focused','momentum','fired up','pumped','alive','clear'];
const LIMIT_K=["i can't","i cant","i always","i never","i'm not","im not","i'm bad","i suck","i should","i have to","i'm afraid","not good enough","too late","not ready","i'm too"];
const ACTION_K=['need to','should','will','going to','tomorrow','next time','plan to','want to','have to','commit','i\'ll'];
function _sents(t){return t.split(/[\n.!?]+/).map(s=>s.trim()).filter(s=>s.length>4);}
function _find(s,keys){const out=[];for(const x of s){const lx=x.toLowerCase();if(keys.some(k=>lx.includes(k)))out.push(x);}return out;}
function _cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function _topWords(t,n){
  const stop=new Set('the a an and or but to of in on for with my me you it that this is was were be been being have has had do did doing at as so if then than too very just really can will would should could not no him her them they we our your also about into out up down off over under again more most some such only own same get got going feel felt like dont didnt wasnt its today day really things stuff went lot bit even still back'.split(' '));
  const counts={};(t.toLowerCase().match(/[a-z']{4,}/g)||[]).forEach(w=>{if(!stop.has(w))counts[w]=(counts[w]||0)+1;});
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,n);
}
function insightBlocks(arr){return arr.map(b=>`<div class="insight"><div class="il">${b.label}</div><div class="it">${escHtml(b.text)}</div></div>`).join('');}
function badgeRow(text){
  const t=text.toLowerCase();
  const w=WIN_K.filter(k=>t.includes(k)).length, h=HARD_K.filter(k=>t.includes(k)).length, e=DRAIN_K.concat(UP_K).filter(k=>t.includes(k)).length;
  let b='';
  if(w)b+=`<span class="rbadge win">✓ ${w} win signal${w>1?'s':''}</span>`;
  if(h)b+=`<span class="rbadge hard">△ ${h} hard moment${h>1?'s':''}</span>`;
  if(e)b+=`<span class="rbadge energy">⚡ ${e} energy cue${e>1?'s':''}</span>`;
  return b?`<div style="margin-bottom:12px">${b}</div>`:'';
}
function localNote(){return '<div style="margin-top:10px;color:var(--muted-2);font-size:12px">Generated on-device from your own words — no internet needed.</div>';}

/* ---- live Claude analysis via the serverless proxy (/api/reflect) ---- */
async function askClaudeAPI(system,prompt){
  const r=await fetch('/api/reflect',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({system,prompt})});
  let d=null; try{ d=await r.json(); }catch(_){}
  if(!r.ok) throw new Error((d&&d.error)||('HTTP '+r.status));
  return (d&&d.text)||'';
}
function aiLoading(title){return `<div class="card"><div class="section-label" style="margin:0 0 12px">${title}</div><div class="insight"><div class="it" style="color:var(--muted)">✦ Reflecting with Claude…</div></div></div>`;}
function aiResultCard(title,text){return `<div class="card"><div class="section-label" style="margin:0 0 12px">${title}</div><div class="insight"><div class="it" style="white-space:pre-wrap">${escHtml(text)}</div></div></div>`;}
function apiNote(e){const msg=(e&&e.message)||''; const hint=/not set|HTTP 5|HTTP 404/i.test(msg)?' Add ANTHROPIC_API_KEY in Vercel → Settings → Environment Variables, then redeploy.':''; return '<div style="margin-top:10px;color:var(--muted-2);font-size:12px">⚠ Live Claude analysis unavailable'+(msg?' ('+escHtml(msg)+')':'')+'. Showing on-device insights.'+hint+'</div>';}
function reflectInsightLocalHTML(text){
  const s=_sents(text);
  const win=_find(s,WIN_K)[0], hard=_find(s,HARD_K)[0], drain=_find(s,DRAIN_K)[0], action=_find(s,ACTION_K)[0];
  return badgeRow(text)+insightBlocks([
    {label:'Win to anchor', text: win? _cap(win)+'.' : 'You showed up and reflected — name one thing, however small, that went right today.'},
    {label:'What was hard', text: hard? _cap(hard)+'. Sit with what this is pointing you toward — the discomfort usually holds the instruction.' : 'Nothing flagged as hard. Push yourself: what did you avoid or flinch away from?'},
    {label:'Calibrate tomorrow', text: action? _cap(action)+'.' : (drain? 'Protect your energy around: '+drain.toLowerCase()+'.' : 'Pick one lever that worked today and repeat it deliberately tomorrow.')}
  ]);
}
function reflectTrendsLocalHTML(combined){
  const s=_sents(combined), top=_topWords(combined,6);
  const hard=_find(s,HARD_K), drains=_find(s,DRAIN_K), ups=_find(s,UP_K), wins=_find(s,WIN_K), limits=_find(s,LIMIT_K);
  return insightBlocks([
    {label:'Recurring themes', text: top.length?top.map(([w,c])=>w+' ×'+c).join(', '):'Keep journaling — patterns surface with more entries.'},
    {label:'Drains your energy', text: drains.length?drains.slice(0,2).map(_cap).join('\n'):(hard.length?_cap(hard[0]):'No clear energy drains logged.')},
    {label:'Creates momentum', text: ups.length?ups.slice(0,2).map(_cap).join('\n'):(wins.length?_cap(wins[0]):'Note what energizes you so it shows up here.')},
    {label:'Identity insight', text: limits.length?'A repeating story: "'+limits[0].toLowerCase()+'". Notice how often it shows up — is it true, or just familiar?':'No single limiting story is dominating — keep writing honestly to surface it.'},
    {label:'This week', text: wins.length?'Engineer more reps of: '+wins[0].toLowerCase().slice(0,90)+'.':'Choose one keystone habit and protect it daily.'}
  ]);
}

async function runReflectAnalysis(){
  const text=document.getElementById('analyzeInput').value.trim();
  const out=document.getElementById('analyzeResult');
  if(!text){toast('Paste something to analyze.');return;}
  const mode=document.getElementById('analyzeMode').value;
  const titles={patterns:'Patterns & sticking points',identity:'Identity blocks',gameplan:'Weekly game plan',wins:'Wins & lessons'};
  const prompts={
    patterns:'Analyze this reflection for recurring patterns, sticking points, and where I seem misaligned or uncalibrated. What themes keep appearing? What is holding me back from my next level? Be direct, no fluff.',
    identity:'Read this and tell me what beliefs, behaviors, or blind spots are holding back the next stage of who I am becoming. What is the gap between who I am being and who I want to be? Give me 3 to 5 specific observations.',
    gameplan:'Based on this reflection, create a practical weekly game plan. Identify: 1) my top 3 focus areas this week, 2) one thing to stop, 3) one thing to start, 4) one thing to double down on.',
    wins:'Extract and celebrate the real wins from this reflection, then pull out the key lessons. Format: Wins, then Lessons.'
  };
  out.innerHTML=aiLoading('Reflection coach — '+titles[mode]);
  try{
    const res=await askClaudeAPI('You are a direct, insightful high-ticket sales reflection coach helping someone level up through self-awareness. You find the instruction within the pain. Plain text, no markdown, no bullet symbols — clean paragraphs or numbered lists.', prompts[mode]+'\n\nContent:\n'+text);
    out.innerHTML=aiResultCard('Reflection coach — '+titles[mode],res);
  }catch(e){
    out.innerHTML=`<div class="card"><div class="section-label" style="margin:0 0 12px">Reflection coach — ${titles[mode]} (on-device)</div>${reflectAnalysisHTML(text,mode)}${apiNote(e)}</div>`;

function reflectAnalysisHTML(text,mode){
  const s=_sents(text);
  const wins=_find(s,WIN_K), hard=_find(s,HARD_K), drains=_find(s,DRAIN_K), limits=_find(s,LIMIT_K), actions=_find(s,ACTION_K);
  const top=_topWords(text,5).map(([w,c])=>w+' ('+c+')').join(', ');
  if(mode==='patterns') return insightBlocks([
    {label:'Recurring themes', text: top||'Not enough text yet to find strong patterns — write more raw detail.'},
    {label:'Sticking points', text: hard.length?hard.slice(0,3).map(_cap).join('\n'):'No clear sticking points named.'},
    {label:'What may be holding you back', text: limits.length?_cap(limits[0])+' — that sounds like a story, not a fact.':'Watch for absolute language ("always", "never", "can\'t") as you write more.'}
  ]);
  if(mode==='identity') return insightBlocks([
    {label:'Limiting stories detected', text: limits.length?limits.slice(0,3).map(_cap).join('\n'):'No obvious limiting beliefs here. Probe: where do you shrink?'},
    {label:'The gap', text: hard.length?'Between who showed up here and who you want to be — look at: '+hard[0].toLowerCase().slice(0,90)+'…':'Define the next-level version of you in one sentence, then re-read this.'},
    {label:'Reframe', text:'Rewrite one limiting line as a choice: "I can\'t" → "I haven\'t yet" → "here\'s my next rep."'}
  ]);
  if(mode==='gameplan') return insightBlocks([
    {label:'Top focus this week', text:(wins.length?'Double down on what worked: '+wins[0].toLowerCase().slice(0,90):'Pick the 1–3 levers with the most leverage')+'.'},
    {label:'Stop', text: drains.length?_cap(drains[0])+'.':'Cut the lowest-ROI activity that drained you.'},
    {label:'Start', text: actions.length?_cap(actions[0])+'.':'Add one small daily rep toward your biggest goal.'},
    {label:'Double down', text: wins.length?_cap(wins[0])+'.':'Repeat your highest-energy activity more often.'}
  ]);
  return insightBlocks([
    {label:'Wins', text: wins.length?wins.slice(0,4).map(_cap).join('\n'):'Name the things you did anyway, even when it was hard.'},
    {label:'Lessons', text: hard.length?hard.slice(0,3).map(x=>_cap(x)+' → what would you do differently?').join('\n'):'Pull one lesson from a moment that stung.'}
  ]);
}

function profilePhotoChange(input){
  const file=input.files&&input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const max=256; let w=img.width,h=img.height;
      if(w>h){if(w>max){h=Math.round(h*max/w);w=max;}}else{if(h>max){w=Math.round(w*max/h);h=max;}}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      let data;try{data=c.toDataURL('image/jpeg',0.85);}catch(e){data=ev.target.result;}
      const u=Store.current(); Store.setUser(u.id,{photo:data});
      renderShell(); renderProfile(); toast('Photo updated ✓');
    };
    img.onerror=()=>toast('Could not read that image.');
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

      _charts.mgYear=new Chart(yc,{type:'bar',data:{labels:MG_MONTHS.map(m=>m.slice(0,3)),datasets:[
        {label:'Earned',data:monthly,backgroundColor:barColors,borderRadius:6,maxBarThickness:40,order:2},
        {label:'Goal',type:'line',data:goalArr,borderColor:'#f59e0b',borderWidth:2,borderDash:[4,4],pointRadius:3,pointBackgroundColor:'#f59e0b',fill:false,tension:0,spanGaps:false,order:1}
      ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        onClick:(evt,els)=>{if(els&&els.length){mgYear=mgBannerYear;mgMonth=els[0].index;renderMoney();}},
        plugins:{legend:{display:false},tooltip:{backgroundColor:'#1a1a21',borderColor:'#33333f',borderWidth:1,padding:10,callbacks:{title:items=>MG_MONTHS[items[0].dataIndex]+' '+by,label:item=>item.raw==null?null:item.dataset.label+': '+mgMoney(item.raw)}}},
        scales:{x:{grid:{display:false},ticks:{color:'#9a9aa5'}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#9a9aa5',callback:v=>mgShort(v)},beginAtZero:true}}}});
    }
    const cc=document.getElementById('mgChart');
    if(cc){ if(_charts.mg)_charts.mg.destroy();
      const ctx=cc.getContext('2d');const grad=ctx.createLinearGradient(0,0,0,330);grad.addColorStop(0,lineColor==='#f87171'?'rgba(248,113,113,.22)':'rgba(52,211,153,.22)');grad.addColorStop(1,'rgba(0,0,0,0)');
      _charts.mg=new Chart(ctx,{type:'line',data:{labels,datasets:[
        {label:'Your Progress',data:cum,borderColor:lineColor,backgroundColor:grad,borderWidth:2.5,tension:.25,pointRadius:0,pointHoverRadius:5,fill:true,spanGaps:false},
        {label:'Required Pace',data:req,borderColor:'#6c6c77',borderWidth:1.5,borderDash:[6,6],pointRadius:0,fill:false,tension:0},
        {label:'Goal',data:goalLine,borderColor:'#f59e0b',borderWidth:1.5,borderDash:[3,3],pointRadius:0,fill:false}
      ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{display:false},tooltip:{backgroundColor:'#1a1a21',borderColor:'#33333f',borderWidth:1,padding:10,callbacks:{title:items=>MG_MONTHS[mgMonth]+' '+items[0].label,label:item=>item.raw==null?null:item.dataset.label+': '+mgMoney(item.raw)}}},
        scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#9a9aa5',maxTicksLimit:10}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#9a9aa5',callback:v=>mgShort(v)},beginAtZero:true}}}});
    }
  }
}
function mgSaveGoal(){const u=Store.current();const v=parseFloat(document.getElementById('mgGoalInput').value);if(isNaN(v)||v<0){toast('Enter a valid goal amount.');return;}Store.setMoneyGoal(u.id,mgKey(mgYear,mgMonth),v);toast('Goal saved ✓');renderMoney();}
function mgAddEntry(){const u=Store.current();const amt=parseFloat(document.getElementById('mgAmount').value);const date=document.getElementById('mgDate').value;if(isNaN(amt)||amt<=0){toast('Enter a positive amount.');return;}if(!date){toast('Pick a date.');return;}Store.addMoneyEntry(u.id,date,amt);toast('Entry added ✓');renderMoney();}
function mgEditEntry(id){const u=Store.current();const e=Store.moneyEntries(u.id).find(x=>x.id===id);if(!e)return;const v=prompt('Edit amount ($):',e.amount);if(v===null)return;const p=parseFloat(v);if(isNaN(p)||p<=0){toast('Invalid amount.');return;}Store.updateMoneyEntry(u.id,id,p);renderMoney();}
function mgDelEntry(id){const u=Store.current();if(confirm('Delete this entry?')){Store.deleteMoneyEntry(u.id,id);renderMoney();}}
function mgChangeMonth(d){mgMonth+=d;if(mgMonth<0){mgMonth=11;mgYear--;}if(mgMonth>11){mgMonth=0;mgYear++;}renderMoney();}
function mgToday(){const t=new Date();mgYear=t.getFullYear();mgMonth=t.getMonth();mgBannerYear=t.getFullYear();renderMoney();}
function mgChangeYear(d){mgBannerYear+=d;renderMoney();}
function mgExport(){const u=Store.current();const data={goals:Store.moneyGoals(u.id),entries:Store.moneyEntries(u.id)};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moneygt-'+todayStr()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Data exported ✓');}

/* =========================================================================
   PUBLIC CARD ROUTE
   ========================================================================= */
function renderPublic(){
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.add('hidden');
  const pub=document.getElementById('public');pub.classList.remove('hidden');
  let d;
  try{ d=JSON.parse(decodeURIComponent(atob(location.hash.slice(6)))); }catch(e){ d=null; }
  if(!d){pub.innerHTML='<div class="empty">Invalid card link.</div>';return;}
  pub.innerHTML=`<div class="public-top"><a href="#" onclick="location.hash='';location.reload();return false">‹ Back</a><div class="brand"><div class="logo" style="width:30px;height:30px">${LOGO_SVG}</div><div class="name" style="font-size:16px">#1Setters</div></div><span></span></div>`+`
    <div style="width:100%;max-width:520px">${previewCardHTML(d)}</div>`;
}

/* boot */
boot();
</script>
